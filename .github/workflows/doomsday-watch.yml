name: Doomsday watch

# One job checks District every 2 minutes for ~55 minutes; the schedule queues
# the next job so coverage is continuous (GitHub's minimum schedule is 5 min).
#
# Where it runs is set by the repo variable RUNNER (Settings > Secrets and
# variables > Actions > Variables):
#   unset / ubuntu-latest  -> GitHub's servers (District often blocks these)
#   self-hosted            -> your own machine (home internet, not blocked)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: send a summary to Telegram (no loop, state unchanged)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: doomsday-watch-${{ (github.event_name == 'workflow_dispatch' && inputs.test) && 'test' || 'loop' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 65
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install -q playwright==1.48.0
          python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: Test run
        if: github.event_name == 'workflow_dispatch' && inputs.test
        run: python watch.py --test

      - name: Check District every 2 min
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test) }}
        # On your own machine District doesn't block, so never give up early
        run: python loop.py 55 ${{ vars.RUNNER == 'self-hosted' && '0' || '2' }}

      - name: Upload debug page
        if: always() && hashFiles('debug/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: district-debug
          path: debug/
          retention-days: 3
          overwrite: true

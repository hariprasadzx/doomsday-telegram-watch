name: Doomsday watch

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 min (GitHub may delay runs at busy times)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test summary to Telegram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: doomsday-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Check District
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && '--test' || '' }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update watch state" && git pull --rebase && git push)
